name: Keep Supabase awake

# Free-tier Supabase projects pause after about a week without database
# activity. A paused project only breaks RSVP submissions (the programme falls
# back to hardcoded copy), so nobody would notice. One small read a day
# prevents the pause.
#
# GitHub disables scheduled workflows in a public repo after 60 days without a
# commit; re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: '17 6 * * *' # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one row from the programme table
        run: |
          # Same public URL and publishable key the site ships to browsers.
          set -a; . ./.env.production; set +a
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$VITE_SUPABASE_URL/rest/v1/programme?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_KEY")
          echo "Supabase answered $status"
          test "$status" = 200
